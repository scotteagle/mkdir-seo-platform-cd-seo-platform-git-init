<!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="UTF-8">
  <title>AI Visibility Dashboard</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, Segoe UI, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 32px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #8b949e; font-size: 13px; margin-bottom: 24px; }
  .layout { display: flex; gap: 24px; align-items: flex-start; }
  .brands { min-width: 200px; }
  .brand-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; border: 1px solid #21262d; }
  .brand-item:hover { background: #161b22; }
  .brand-item.active { background: #1f2937; border-color: #58a6ff; }
  .main { flex: 1; }
  .query-card { border: 1px solid #21262d; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .query-text { font-weight: 600; margin-bottom: 10px; }
  .surface-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid #161b22; font-size: 13px; }
  .surface-name { width: 140px; text-transform: capitalize; color: #8b949e; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.yes { background: #1f6f43; color: #7ee2a8; }
  .badge.no { background: #3a1f1f; background: #3a2323; color: #f2a3a3; }
    .prominence-bar { flex: 1; height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; max-width: 160px; }
  .prominence-fill { height: 100%; background: #58a6ff; }
  .snippet { color: #8b949e; font-size: 12px; margin-top: 4px; }
  .empty { color: #8b949e; padding: 40px; text-align: center; border: 1px dashed #30363d; border-radius: 8px; }
  .sentiment { font-size: 11px; padding: 1px 6px; border-radius: 4px; }
  .sentiment.positive { background: #1f6f43; color: #7ee2a8; }
  .sentiment.negative { background: #3a2323; color: #f2a3a3; }
    .sentiment.neutral { background: #21262d; color: #8b949e; }
</style>
  </head>
  <body>

  <h1>AI Visibility Dashboard</h1>
<div class="sub">Live data from your AI Visibility Tracker API</div>

<div class="layout">
  <div class="brands" id="brands"></div>
  <div class="main" id="main"><div class="empty">Select a brand to see tracked queries</div></div>
</div>

<script>
  const api = (path) => fetch(path).then(r => r.json());

async function loadBrands() {
  const brands = await api('/brands');
  const el = document.getElementById('brands');
  el.innerHTML = '';
      brands.forEach(b => {
            const div = document.createElement('div');
            div.className = 'brand-item';
    div.textContent = b.name;
    div.onclick = () => selectBrand(b.id, div);
    el.appendChild(div);
});
  if (brands.length) selectBrand(brands[0].id, el.firstChild);
                      }

async function selectBrand(id, el) {
  document.querySelectorAll('.brand-item').forEach(x => x.classList.remove('active'));
  if (el) el.classList.add('active');
  const queries = await api(`/brands/${id}/queries`);
  const main = document.getElementById('main');
  main.innerHTML = '';
      if (!queries.length) {
    main.innerHTML = '<div class="empty">No tracked queries yet for this brand.</div>';
    return;
      }
  queries.forEach(q => main.appendChild(renderQueryCard(q)));
}

function renderQueryCard(q) {
    const card = document.createElement('div');
  card.className = 'query-card';
  const title = document.createElement('div');
  title.className = 'query-text';
  title.textContent = q.query_text;
  card.appendChild(title);

  const surfaces = Object.keys(q.latest);
  if (!surfaces.length) {
    const row = document.createElement('div');
    row.className = 'snippet';
    row.textContent = 'No data yet — waiting on first check.';
    card.appendChild(row);
    return card;
  }

  surfaces.forEach(surface => {
        const s = q.latest[surface];
        const row = document.createElement('div');
    row.className = 'surface-row';
    const pct = Math.round((s.prominence || 0) * 100);
    row.innerHTML = `
      <div class="surface-name">${surface}</div>
      <span class="badge ${s.mentioned ? 'yes' : 'no'}">${s.mentioned ? 'Mentioned' : 'Not mentioned'}</span>
      <div class="prominence-bar"><div class="prominence-fill" style="width:${pct}%"></div></div>
      <span class="sentiment ${s.sentiment}">${s.sentiment}</span>
    `;
    card.appendChild(row);
    if (s.snippet) {
      const snip = document.createElement('div');
      snip.className = 'snippet';
      snip.textContent = s.snippet;
      card.appendChild(snip);
}
});
  return card;
}

loadBrands();
</script>
</body>
</html>
